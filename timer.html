<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Work Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: fit-content;
            height: fit-content;
            overflow: hidden;
            background: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            color: #fff;
        }

        .container {
            position: relative;
            text-align: center;
            padding: 32px;
            background: rgba(26, 26, 46, 0.75);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 340px;
        }

        .window-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 6px;
        }

        .win-btn {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            line-height: 1;
            color: rgba(255, 255, 255, 0.65);
            background: rgba(255, 255, 255, 0.08);
            transition: background 0.2s ease, color 0.2s ease;
        }

        .win-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .win-btn.close-btn:hover {
            background: #ff4757;
            color: #fff;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 6px;
            color: #e0e0e0;
        }

        .subtitle {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 22px;
        }

        .duration-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-duration {
            padding: 10px 6px;
            border: 2px solid #3a3a5c;
            background: transparent;
            color: #aaa;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-duration:hover {
            border-color: #5a5a8c;
            color: #fff;
        }

        .btn-duration.selected {
            border-color: #4d90fe;
            background: rgba(77, 144, 254, 0.2);
            color: #4d90fe;
        }

        .start-btn {
            padding: 14px 36px;
            font-size: 1rem;
            background: linear-gradient(135deg, #4d90fe 0%, #3a7bd5 100%);
            border: none;
            color: white;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 22px;
            font-weight: 600;
        }

        .start-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(77, 144, 254, 0.4);
        }

        .start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .timer-display {
            font-size: 4rem;
            font-weight: 300;
            color: #e0e0e0;
            margin: 16px 0;
            text-shadow: 0 0 30px rgba(77, 144, 254, 0.5);
        }

        .timer-display.running {
            color: #4d90fe;
        }

        .timer-display.completed {
            color: #4caf50;
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .status {
            font-size: 1.1rem;
            margin-bottom: 16px;
            min-height: 28px;
        }

        .status.running {
            color: #4d90fe;
        }

        .status.completed {
            color: #4caf50;
        }

        .stop-btn {
            padding: 10px 28px;
            background: rgba(255, 71, 87, 0.2);
            border: 2px solid #ff4757;
            color: #ff4757;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .stop-btn:hover:not(:disabled) {
            background: rgba(255, 71, 87, 0.3);
        }

        .stop-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .hidden {
            visibility: hidden;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4d90fe, #3a7bd5);
            width: 0%;
            transition: width 1s linear;
        }
    </style>
</head>
<body>
    <div class="container" id="app">
        <div class="window-controls">
            <button class="win-btn" id="minimizeBtn" title="Minimize to tray">–</button>
            <button class="win-btn close-btn" id="closeBtn" title="Close">×</button>
        </div>

        <h1>🧠 Deep Work</h1>
        <p class="subtitle">Focus Session Timer</p>

        <div class="duration-buttons" id="durationButtons">
            <button class="btn-duration" data-minutes="5">5 min</button>
            <button class="btn-duration" data-minutes="10">10 min</button>
            <button class="btn-duration" data-minutes="15">15 min</button>
            <button class="btn-duration" data-minutes="20">20 min</button>
            <button class="btn-duration" data-minutes="25">25 min</button>
            <button class="btn-duration" data-minutes="30">30 min</button>
            <button class="btn-duration" data-minutes="40">40 min</button>
            <button class="btn-duration" data-minutes="50">50 min</button>
        </div>

        <button class="start-btn" id="startBtn" disabled>Start Session</button>

        <div class="timer-display" id="timerDisplay">--:--</div>

        <p class="status" id="statusText"></p>

        <button class="stop-btn hidden" id="stopBtn">Stop Session</button>

        <div class="progress-bar">
            <div class="progress-fill" id="progressBar"></div>
        </div>
    </div>

    <script>
        // Audio context for notification sound
        let audioContext = null;
        let timerInterval = null;
        let selectedDuration = null;
        let isRunning = false;
        let timeRemaining = 0;
        let totalTime = 0;
        let sessionEndTime = 0;

        const durationButtons = document.getElementById('durationButtons');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');
        const minimizeBtn = document.getElementById('minimizeBtn');
        const closeBtn = document.getElementById('closeBtn');

        // Talk to the desktop wrapper (launcher.py), if present
        function notifyApp(payload) {

    // Windows WebView2
    if (window.chrome?.webview) {
        window.chrome.webview.postMessage(payload);
        return;
    }

    // Linux WebKitGTK
    if (
        window.webkit?.messageHandlers?.app
    ) {
        window.webkit.messageHandlers.app.postMessage(
            JSON.stringify(payload)
        );
        return;
    }
}

        minimizeBtn.addEventListener('click', () => notifyApp({ action: 'minimize' }));
        closeBtn.addEventListener('click', () => notifyApp({ action: 'close' }));

        // Initialize audio context on first user interaction
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Play notification sound
        function playNotificationSound() {
            initAudio();

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.frequency.value = 880;
            oscillator.type = 'sine';

            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 1.5);
        }

        // Format time as MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Update timer display
        function updateDisplay() {
            timerDisplay.textContent = formatTime(timeRemaining);
            const progress = ((totalTime - timeRemaining) / totalTime) * 100;
            progressBar.style.width = `${progress}%`;

            if (timeRemaining <= 0) {
                timerDisplay.classList.add('completed');
            } else {
                timerDisplay.classList.remove('completed');
            }
        }

        // Start session
        function startSession() {
            initAudio();

            selectedDuration = parseInt(durationButtons.querySelector('.selected')?.dataset.minutes || 5);
            totalTime = selectedDuration * 60;
            timeRemaining = totalTime;
            sessionEndTime = Date.now() + totalTime * 1000;
            isRunning = true;

            timerDisplay.classList.add('running');
            statusText.textContent = 'Deep Work Session in Progress';
            statusText.classList.add('running');
            startBtn.disabled = true;
            stopBtn.classList.remove('hidden');
            stopBtn.disabled = false;

            // Start countdown
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            timerInterval = setInterval(() => {
                // Wall-clock based, not a naive per-tick decrement: a hidden/minimized
                // window gets its timers throttled by WebKit, so ticks can arrive far
                // less often than once a second. Recomputing from Date.now() means the
                // display is always correct the moment it's actually checked.
                timeRemaining = Math.max(0, Math.round((sessionEndTime - Date.now()) / 1000));
                updateDisplay();

                if (timeRemaining <= 0) {
                    completeSession();
                }
            }, 1000);

            notifyApp({ action: 'start', duration: totalTime });
        }

        // Complete session
        function completeSession() {
            if (!isRunning) {
                return; // already completed (e.g. forced by the desktop wrapper)
            }
            clearInterval(timerInterval);
            isRunning = false;

            timerDisplay.classList.remove('running');
            timerDisplay.classList.add('completed');
            statusText.textContent = '✓ Session Completed! Great focus!';
            statusText.classList.remove('running');
            statusText.classList.add('completed');
            startBtn.disabled = false;
            stopBtn.disabled = true;
            stopBtn.classList.add('hidden');

            playNotificationSound();
            notifyApp({ action: 'complete' });
        }

        // Stop session
        function stopSession() {
            clearInterval(timerInterval);
            isRunning = false;

            timerDisplay.classList.remove('running', 'completed');
            statusText.textContent = 'Session Stopped';
            statusText.classList.remove('running', 'completed');
            startBtn.disabled = false;
            stopBtn.disabled = true;
            stopBtn.classList.add('hidden');

            notifyApp({ action: 'cancel' });
        }

        // Handle duration button selection
        durationButtons.addEventListener('click', (e) => {
            if (e.target.classList.contains('btn-duration')) {
                document.querySelectorAll('.btn-duration').forEach(btn => {
                    btn.classList.remove('selected');
                });
                e.target.classList.add('selected');

                startBtn.disabled = false;
                timerDisplay.textContent = `${e.target.dataset.minutes}:00`;
            }
        });

        // Start button click
        startBtn.addEventListener('click', () => {
            if (isRunning) {
                stopSession();
            } else {
                startSession();
            }
        });

        // Stop button click
        stopBtn.addEventListener('click', () => {
            stopSession();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'BUTTON') {
                e.preventDefault();
                if (isRunning) {
                    stopSession();
                } else {
                    startSession();
                }
            }
        });
    </script>
</body>
</html>
